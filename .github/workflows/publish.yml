name: publish

# Publishes to npm via OIDC trusted publishing -- no npm token exists anywhere,
# so there is nothing to leak, rotate, or have stolen. npm verifies GitHub's
# signed claim about which repository and workflow is asking.
#
# Deliberately a SEPARATE workflow from ci.yml. CI runs on every pull request,
# including from forks; granting publish rights to that workflow would mean an
# outside contributor's PR could reach a path that ships code under our name.
# This one fires only on a tag we push, or a manual dispatch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm rejects the publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Everything below runs BEFORE publish, and any failure aborts it.
      # `prepublishOnly` in package.json runs the same gate, but relying on that
      # alone would mean a future edit to that script could silently remove the
      # gate. Stated here as well, where a reviewer can see it.
      - name: Typecheck (strict)
        run: npx tsc -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit + store conformance
        run: npm test

      - name: Storm proof -- 1,000 racers must elect exactly one execution
        run: npm run test:storm

      - name: Version in package.json must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      # No NODE_AUTH_TOKEN. The OIDC exchange is what authenticates us.
      - name: Publish
        run: npm publish --access public

      - name: Verify it is actually installable from the registry
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          # npm's registry is read-through-cached; give it a moment to settle
          # rather than declaring success on the publish command's own word.
          for i in 1 2 3 4 5 6; do
            if npm view "once-kernel@$PKG" version >/dev/null 2>&1; then
              echo "once-kernel@$PKG is live on the registry"
              exit 0
            fi
            echo "not visible yet, retrying ($i/6)"
            sleep 10
          done
          echo "published but not visible on the registry after 60s" >&2
          exit 1
